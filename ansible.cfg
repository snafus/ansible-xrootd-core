[defaults]
inventory         = inventory/hosts.yml
roles_path        = roles
host_key_checking = False
stdout_callback   = yaml
# Opt into the new fact access style; suppresses INJECT_FACTS_AS_VARS deprecation warning.
# All roles use ansible_facts['name'] instead of bare ansible_name variables.
inject_facts_as_vars = False

# Show task execution time
callbacks_enabled = timer, profile_tasks

[ssh_connection]
pipelining = True
