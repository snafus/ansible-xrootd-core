---
# Set CPU frequency scaling governor to 'performance'.
# Recommended by ESNet for 100G nodes — can increase throughput by ~30%.
# Not recommended for shared compute nodes (increases power consumption).
#
# Immediate effect: cpupower frequency-set
# Persistence: tune-cpu-governor.service (systemd oneshot)

- name: Install cpupower — Rocky
  ansible.builtin.package:
    name: kernel-tools
    state: present
  when: ansible_facts['os_family'] == 'RedHat'

- name: Install cpupower — Ubuntu
  ansible.builtin.package:
    name:
      - linux-tools-common
      - linux-tools-generic
    state: present
  when: ansible_facts['os_family'] == 'Debian'

- name: Check whether CPU frequency scaling is available
  ansible.builtin.stat:
    path: /sys/devices/system/cpu/cpu0/cpufreq/scaling_governor
  register: _cpufreq_stat

- name: Warn if CPU frequency scaling is not available
  ansible.builtin.debug:
    msg: >
      tune: CPU frequency scaling not available on this host
      (/sys/devices/system/cpu/cpu0/cpufreq/scaling_governor not found).
      This is expected on VMs and containers.  tune_cpu_governor_enabled has no effect.
  when: not _cpufreq_stat.stat.exists

- name: Read current CPU governor
  ansible.builtin.command:
    cmd: "cat /sys/devices/system/cpu/cpu0/cpufreq/scaling_governor"
  register: _current_governor
  changed_when: false
  when: _cpufreq_stat.stat.exists

- name: Set CPU governor (immediate)
  ansible.builtin.command:
    cmd: "cpupower frequency-set -g {{ tune_cpu_governor }}"
  changed_when: true
  when:
    - _cpufreq_stat.stat.exists
    - _current_governor.stdout | trim != tune_cpu_governor

# Deploy a systemd oneshot to re-apply the governor at boot.
- name: Deploy CPU governor systemd unit
  ansible.builtin.template:
    src: tune-cpu-governor.service.j2
    dest: /etc/systemd/system/tune-cpu-governor.service
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload systemd daemon
    - Restart tune-cpu-governor
  when: _cpufreq_stat.stat.exists

- name: Enable CPU governor service
  ansible.builtin.systemd:
    name: tune-cpu-governor.service
    enabled: true
    daemon_reload: true
  when: _cpufreq_stat.stat.exists
