---
# NIC identification — no default, must be set at host level in inventory.
# See inventory/hosts.yml.example for the recommended pattern.
# Required by: qdisc, ethtool, jumbo_frames, irq_affinity tasks.
tune_nic_device: ""

# Speed tier — drives ESNet sysctl buffer preset selection.
#   auto  : detect from ansible_facts[tune_nic_device].speed (Mbps)
#           mapping: ≤10 000 → 10g | 10 001–40 000 → 40g | >40 000 → 100g
#           falls back to 10g when speed is -1 (VM) or tune_nic_device is unset
#   10g | 40g | 100g : explicit override, bypasses detection entirely
tune_nic_speed: auto

# --- Task enables -----------------------------------------------------------
# sysctl is on by default (safe, no hardware dependency).
# All other tasks are opt-in and require tune_nic_device.
tune_sysctl_enabled:         true
tune_qdisc_enabled:          false
tune_ethtool_enabled:        false
tune_jumbo_frames_enabled:   false
tune_cpu_governor_enabled:   false
tune_irq_affinity_enabled:   false
tune_grub_iommu_enabled:     false   # REQUIRES REBOOT
tune_grub_smt_disable:       false   # REQUIRES REBOOT
tune_grub_reboot:            false   # set true to reboot automatically after grub changes

# --- sysctl overrides -------------------------------------------------------
# Leave empty to use the tier preset value.  Set to override a specific param.
tune_rmem_max:   ""
tune_wmem_max:   ""
tune_tcp_rmem:   ""
tune_tcp_wmem:   ""
tune_optmem_max: ""   # only in preset for 100g; set explicitly for other tiers

# --- ESNet buffer presets (private — do not override directly) ---------------
# Source: https://fasterdata.es.net/host-tuning/linux/ (reviewed 2026-03-29)
_tune_presets:
  10g:
    rmem_max:   67108864              # 64 MB
    wmem_max:   67108864
    tcp_rmem:   "4096 87380 33554432"   # max 32 MB
    tcp_wmem:   "4096 65536 33554432"
    optmem_max: ~
  40g:
    rmem_max:   134217728             # 128 MB
    wmem_max:   134217728
    tcp_rmem:   "4096 87380 67108864"   # max 64 MB
    tcp_wmem:   "4096 65536 67108864"
    optmem_max: ~
  100g:
    rmem_max:   2147483647            # 2 GB (Linux max)
    wmem_max:   2147483647
    tcp_rmem:   "4096 131072 1073741824"  # max 1 GB
    tcp_wmem:   "4096 16384  1073741824"
    optmem_max: 1048576               # required for MSG_ZEROCOPY at 100G

# --- qdisc ------------------------------------------------------------------
tune_qdisc_maxrate: ""   # e.g. "8gbit" to throttle to 80% of 10G line rate;
                         # empty = fq scheduling only, no rate cap

# --- ethtool ----------------------------------------------------------------
tune_ethtool_ring_rx:              8192
tune_ethtool_ring_tx:              8192
tune_ethtool_coalesce_adaptive_rx: "on"
tune_ethtool_coalesce_adaptive_tx: "on"
tune_ethtool_flowcontrol_rx:       "on"
tune_ethtool_flowcontrol_tx:       "on"

# --- jumbo frames -----------------------------------------------------------
tune_mtu: 9000   # standard jumbo MTU; only enable when full path supports it

# --- CPU governor -----------------------------------------------------------
tune_cpu_governor: performance

# --- IRQ affinity -----------------------------------------------------------
# set_irq_affinity_bynode.sh is shipped with Mellanox OFED; not present on
# vanilla kernel nodes.  The task skips gracefully if the script is absent.
tune_irq_affinity_script: /usr/sbin/set_irq_affinity_bynode.sh
