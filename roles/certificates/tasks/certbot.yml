---
# Obtain a TLS certificate from Let's Encrypt using certbot in standalone mode.
# Standalone mode requires port 80 to be publicly reachable.
# certbot_staging uses the staging ACME endpoint — no rate limits, untrusted CA.

- name: Assert certbot email is configured
  ansible.builtin.assert:
    that:
      - xrootd_certbot_email != ''
    fail_msg: >
      xrootd_certbot_email must be set for certbot cert modes.
      Add vault_certbot_email to your vault.yml file.

- name: Install certbot (Rocky — from EPEL)
  ansible.builtin.dnf:
    name: certbot
    state: present
  when: ansible_facts['os_family'] == 'RedHat'

- name: Install certbot (Ubuntu)
  ansible.builtin.apt:
    name: certbot
    state: present
  when: ansible_facts['os_family'] == 'Debian'

# Port 80 must be open before certbot runs its HTTP-01 challenge.
# The certificates role runs before the xrootd role, so the xrootd
# firewall tasks have not yet executed — open port 80 here explicitly.
- name: Allow HTTP (port 80) for ACME challenge (Rocky)
  ansible.posix.firewalld:
    service: http
    permanent: true
    state: enabled
    immediate: true
  when:
    - common_firewall_enabled | bool
    - ansible_facts['os_family'] == 'RedHat'

- name: Allow HTTP (port 80) for ACME challenge (Ubuntu)
  community.general.ufw:
    rule: allow
    port: "80"
    proto: tcp
  when:
    - common_firewall_enabled | bool
    - ansible_facts['os_family'] == 'Debian'

- name: Check if certbot certificate already exists
  ansible.builtin.stat:
    path: "/etc/letsencrypt/live/{{ xrootd_certbot_domain }}/fullchain.pem"
  register: _certbot_cert

- name: Obtain certificate from Let's Encrypt
  ansible.builtin.command:
    cmd: >
      certbot certonly
      --standalone
      --non-interactive
      --agree-tos
      --email {{ xrootd_certbot_email }}
      -d {{ xrootd_certbot_domain }}
      {{ '--staging' if xrootd_cert_mode == 'certbot_staging' else '' }}
  when: not _certbot_cert.stat.exists
  changed_when: true

# Symlink certbot's managed paths into the standard XRootD TLS directory.
# certbot handles rotation under /etc/letsencrypt/live/; symlinks stay valid.
- name: Symlink certbot certificate paths to XRootD TLS directory
  ansible.builtin.file:
    src: "/etc/letsencrypt/live/{{ xrootd_certbot_domain }}/{{ item.src }}"
    dest: "{{ item.dest }}"
    state: link
    force: true
  loop:
    - {src: fullchain.pem, dest: "{{ xrootd_cert_file }}"}
    - {src: privkey.pem, dest: "{{ xrootd_key_file }}"}
    - {src: chain.pem, dest: "{{ xrootd_ca_file }}"}
  notify: Restart xrootd

# Post-renewal hook restarts xrootd so it picks up the new certificate.
- name: Install certbot post-renewal hook for xrootd restart
  ansible.builtin.copy:
    dest: /etc/letsencrypt/renewal-hooks/post/restart-xrootd.sh
    mode: "0755"
    content: |
      #!/bin/bash
      # Restart xrootd after certbot renews the certificate.
      # Managed by Ansible — do not edit manually.
      systemctl restart xrootd@{{ xrootd_config_name | default('standalone') }} || true

# Try the systemd timer first; fall back to cron only if it fails to start
# (e.g. on containers or stripped-down systems without a full systemd).
- name: Enable certbot systemd renewal timer
  ansible.builtin.systemd:
    name: certbot.timer
    state: started
    enabled: true
  register: _certbot_timer
  ignore_errors: true

- name: Install certbot renewal cron job (fallback — systemd timer unavailable)
  ansible.builtin.cron:
    name: certbot-renew
    minute: "0"
    hour: "3"
    day: "*/7"
    job: "certbot renew --quiet"
    user: root
  when: _certbot_timer is failed
