---
# Certificate provisioning.
#
# Output contract — all modes guarantee these files exist after this role runs:
#   {{ xrootd_cert_file }}  — server certificate (PEM)
#   {{ xrootd_key_file }}   — private key (PEM, mode 0600, owner {{ xrootd_user }})
#   {{ xrootd_ca_file }}    — CA bundle (PEM)  [not required for grid ca_mode]

# Ensure the service account exists before writing any files owned by it.
# This role may run before the xrootd role (which installs the package and
# would otherwise create the user), so it must be self-sufficient here.
# UID/GID are left to the OS; the xrootd role can pin them via
# xrootd_user_uid / xrootd_group_gid if predictable IDs are required.
- name: Ensure xrootd group exists
  ansible.builtin.group:
    name: "{{ xrootd_group }}"
    system: true
    state: present

- name: Ensure xrootd user exists
  ansible.builtin.user:
    name: "{{ xrootd_user }}"
    group: "{{ xrootd_group }}"
    shell: /sbin/nologin
    home: /var/spool/xrootd
    create_home: false
    system: true
    comment: XRootD daemon
    state: present

# Reject the combination before doing any work.
- name: Assert self_signed cert mode is not combined with system ca_mode
  ansible.builtin.assert:
    that:
      - not (xrootd_cert_mode == 'self_signed' and xrootd_ca_mode == 'system')
    fail_msg: >
      xrootd_cert_mode 'self_signed' cannot be combined with xrootd_ca_mode 'system'.
      A self-signed certificate is not present in the OS CA bundle so clients will
      reject the server's TLS handshake.  Use xrootd_ca_mode 'file' (default) with
      self_signed cert mode.

- name: Ensure TLS directory exists
  ansible.builtin.file:
    path: "{{ xrootd_cert_dir }}"
    state: directory
    owner: "{{ xrootd_user }}"
    group: "{{ xrootd_group }}"
    mode: "0750"

- name: Provision self-signed certificate
  ansible.builtin.include_tasks: self_signed.yml
  when: xrootd_cert_mode == 'self_signed'

- name: Provision Let's Encrypt certificate via certbot
  ansible.builtin.include_tasks: certbot.yml
  when: xrootd_cert_mode in ['certbot_staging', 'certbot_production']

- name: Deploy externally provided certificate
  ansible.builtin.include_tasks: external.yml
  when: xrootd_cert_mode == 'external'

- name: Configure CA trust bundle
  ansible.builtin.include_tasks: ca_bundle.yml
  when: xrootd_ca_mode in ['system', 'grid']

# --- Post-condition assertions — every mode must satisfy these -------------- #

- name: Stat certificate file
  ansible.builtin.stat:
    path: "{{ xrootd_cert_file }}"
  register: _cert_stat

- name: Fail if certificate file is missing
  ansible.builtin.fail:
    msg: "Certificate not found at {{ xrootd_cert_file }} after certificates role ran."
  when: not _cert_stat.stat.exists

# xrootd_ca_file is only used when ca_mode is 'file' or 'system'.
# In 'grid' mode xrd.tlsca uses certdir instead, so ca_file need not exist.
- name: Stat CA bundle file
  ansible.builtin.stat:
    path: "{{ xrootd_ca_file }}"
  register: _ca_stat
  when: xrootd_ca_mode != 'grid'

- name: Fail if CA bundle file is missing
  ansible.builtin.fail:
    msg: >
      CA bundle not found at {{ xrootd_ca_file }} after certificates role ran.
      For external cert mode provide a CA via xrootd_ext_ca_src or vault_xrootd_ext_ca.
      For system ca_mode check that the OS CA bundle path exists.
  when:
    - xrootd_ca_mode != 'grid'
    - not _ca_stat.stat.exists

- name: Enforce private key permissions
  ansible.builtin.file:
    path: "{{ xrootd_key_file }}"
    owner: "{{ xrootd_user }}"
    group: "{{ xrootd_group }}"
    mode: "0600"
