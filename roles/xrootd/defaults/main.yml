---
# Config profile name — determines which template is deployed and which
# systemd unit is managed:
#   /etc/xrootd/xrootd-{{ xrootd_config_name }}.cfg
#   systemd: xrootd@{{ xrootd_config_name }}
# Options: standalone | server | redirector
xrootd_config_name: standalone

# --- Paths ------------------------------------------------------------------
xrootd_admin_path:  /var/spool/xrootd    # admin socket directory
xrootd_log_path:    /var/log/xrootd      # log files
xrootd_auth_dir:    /opt/xrd/etc         # Authfile and related config

# Exported namespace paths — all entries are equal.
# Each is created on disk (unless create: false) and emitted as an
# 'all.export' directive. xrootd_health_check_path defaults to the first
# entry and is used for post-deploy validation.
#
# Per-entry keys:
#   path:         required — filesystem path to export
#   mode:         optional — directory permissions (default: "0755")
#   create:       optional — create the directory if absent (default: true)
#                 set false for paths owned by an external agent (Puppet, ACME...)
#   mount:        optional — assert the path is a real mount point (default: false)
#                 fails the play if the filesystem is not mounted; prevents xrootd
#                 from silently serving from an empty underlying directory
xrootd_exports:
  - path: /data/xrootd
# Further examples:
# xrootd_exports:
#   - path: /data/xrootd
#   - path: /archive/xrootd
#     mode: "0755"
#   - path: /mnt/ceph/xrootd
#     create: false   # directory pre-exists; do not mkdir
#     mount: true     # fail if CephFS is not mounted at this path

# Path used for post-deploy validation (xrdfs ls). Defaults to the first
# export; override if the first entry is a pre-existing mount that may not
# exist in CI.
xrootd_health_check_path: "{{ xrootd_exports[0].path }}"

# --- Network ----------------------------------------------------------------
xrootd_port:         1094   # XRootD protocol + HTTP port
xrootd_bind_address: ""     # empty = bind all interfaces

# --- TLS --------------------------------------------------------------------
# Populated by the certificates role. Override only if managing certs manually.
# xrootd_cert_dir must match certificates role's value so all three derived
# paths stay in sync when the directory is changed in one place.
xrootd_tls_enabled: true
xrootd_cert_dir:  /etc/xrootd/tls
xrootd_cert_file: "{{ xrootd_cert_dir }}/server.crt"
xrootd_key_file:  "{{ xrootd_cert_dir }}/server.key"
# CA bundle PEM file — used by xrd.tlsca certfile (file and system modes).
# For self-signed mode: the certificates role writes the server cert here.
# For system mode: symlinked to the OS CA bundle by the certificates role.
xrootd_ca_file:   "{{ xrootd_cert_dir }}/ca.crt"

# CA verification mode for xrd.tlsca — must match certificates role value:
#   file   — certfile {{ xrootd_ca_file }} (default)
#   system — certfile {{ xrootd_ca_file }} (symlinked to OS bundle by certs role)
#   grid   — certdir {{ xrootd_ca_dir }} (managed by fetch-crl via certs role)
xrootd_ca_mode: file
xrootd_ca_dir:  /etc/grid-security/certificates
# Grid CA bundle provider — set in certificates role; listed here for reference:
#   egi (default) — EGI IGTF trust anchors (Rocky + Ubuntu)
#   osg           — OSG/CILogon trust anchors (Rocky only)

# --- Features ---------------------------------------------------------------
xrootd_http_enabled:       true    # HTTP/WebDAV protocol (requires xrootd-server with HTTP plugin)
xrootd_http_tpc_enabled:   true    # HTTP Third Party Copy via libXrdHttpTPC.so (requires HTTP enabled)
xrootd_tpc_enabled:        false   # Native XRootD TPC (xrootd.tpc authrz); required for FTS3 XRootD-to-XRootD transfers
xrootd_auth_enabled:       false   # Authfile-based access control
xrootd_scitokens_enabled:  false   # SciTokens / WLCG JWT token auth
xrootd_macaroons_enabled:  false   # Macaroon bearer token auth
xrootd_monitoring_enabled: false   # UDP monitoring export

# --- Checksum ---------------------------------------------------------------
# adler32 is the WLCG standard; required for FTS3 transfer verification and
# Rucio replica catalogue consistency checks.
xrootd_chksum_enabled: true
xrootd_chksum_type:    adler32   # adler32 (WLCG), md5, crc32, sha2
xrootd_chksum_max:     4         # max concurrent checksum calculations

# --- Macaroon secret --------------------------------------------------------
# If vault_macaroon_secret is set: that value is written to the file (required
# for multi-node deployments where tokens must validate across nodes).
# If unset and the file does not exist: a random secret is auto-generated
# (standalone only — not safe for clusters).
xrootd_macaroon_secret_file: /etc/xrootd/macaroon-secret

# --- SciTokens --------------------------------------------------------------
# audience: must match the 'aud' claim in presented JWTs.
#   WLCG-standard any-audience: "https://wlcg.cern.ch/jwt/v1/any"
#   Site-specific (recommended for production): "https://xrootd.example.org/"
# onmissing: passthrough = fall through to next auth layer when no token is
#   presented (allows X.509/macaroon alongside tokens); deny = token required.
xrootd_scitokens_audience: "https://wlcg.cern.ch/jwt/v1/any"
xrootd_scitokens_onmissing: passthrough
xrootd_scitokens_issuers: []
# Example issuer entry:
# - name:         my-iam
#   url:          https://iam.example.org/
#   base_path:    /data/xrootd        # tokens must carry a sub-path of this
#   default_user: xrootd              # Unix user for file operations
#   map_subject:  false               # true = use JWT 'sub' claim as Unix username
#   name_mapfile: ""                  # path to a sub→username map file (optional)

# --- Authfile entries -------------------------------------------------------
xrootd_auth_entries: []
# Example entry:
# - type: g            # u=unix user, g=group, h=hostname
#   name: /ska
#   path: /data/xrootd
#   permissions: rl    # r=read, l=list, w=write, d=delete, a=all

# --- Monitoring (xrd.monitor) -----------------------------------------------
# Sends detailed per-operation event records to a UDP collector.
xrootd_monitoring_host: ""
xrootd_monitoring_port: 9931

# --- Reporting (xrd.report) -------------------------------------------------
# Sends periodic summary statistics to a UDP sink (e.g. xrootd_exporter).
# Distinct from xrd.monitor — lighter weight, suitable for Prometheus scraping.
xrootd_reporting_enabled:  false
xrootd_reporting_host:     ""       # required when xrootd_reporting_enabled: true
xrootd_reporting_port:     9931
xrootd_reporting_interval: "1m"

# --- Trace / logging --------------------------------------------------------
# Empty string omits the directive (uses xrootd built-in defaults).
# Set to a space-separated list of trace flags to enable.
# Examples:
#   xrootd_trace_xrd:      "conn mem net"
#   xrootd_trace_xrootd:   "auth emsg login"
#   xrootd_trace_http:     "request response"   # only emitted when http_enabled
#   xrootd_macaroon_trace: "debug"               # only emitted when macaroons_enabled
xrootd_trace_xrd:      ""
xrootd_trace_xrootd:   ""
xrootd_trace_http:     ""
xrootd_macaroon_trace: ""

# --- Clustered / server mode ------------------------------------------------
xrootd_redirector_host: ""
xrootd_redirector_port: 1094

# --- Log rotation -----------------------------------------------------------
xrootd_log_rotate_frequency: weekly   # daily | weekly | monthly
xrootd_log_rotate_count:     4        # number of rotated files to keep

# --- Site identity ----------------------------------------------------------
xrootd_site_name: "{{ inventory_hostname }}"

# --- systemd resource limits ------------------------------------------------
# Applied via a drop-in at /etc/systemd/system/xrootd@.service.d/limits.conf.
# XRootD opens one file descriptor per active connection and per open file;
# 1 M is the standard setting at WLCG Tier-1 and SRCNet storage nodes.
# Set to "infinity" to remove the cap entirely (requires CAP_SYS_RESOURCE).
xrootd_limit_nofile: 1048576   # LimitNOFILE — open file descriptors
xrootd_limit_nproc:  65536     # LimitNPROC  — threads / sub-processes
# Preload jemalloc to reduce allocator lock contention under high concurrency.
# Recommended for Tier-1 / SRCNet nodes handling many simultaneous transfers.
# Installs the OS package and sets LD_PRELOAD in the systemd drop-in.
xrootd_jemalloc_enabled: false

# --- User / group -----------------------------------------------------------
# xrootd_user and xrootd_group are defined in common/defaults/main.yml.
# The common role creates the account before certificates or xrootd runs.
# Override in group_vars to change both roles at once.

# --- Package version --------------------------------------------------------
# Pin to a specific XRootD release. Empty string installs the latest version
# available from the configured repository (EPEL or CERN repo).
# Examples: "5.6.9"  "5.7.1"
xrootd_version: ""
