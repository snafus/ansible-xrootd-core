---
# Config profile name — determines which template is deployed and which
# systemd unit is managed:
#   /etc/xrootd/xrootd-{{ xrootd_config_name }}.cfg
#   systemd: xrootd@{{ xrootd_config_name }}
# Options: standalone | server | redirector
xrootd_config_name: standalone

# --- Paths ------------------------------------------------------------------
xrootd_data_path:   /data/xrootd         # exported namespace root
xrootd_admin_path:  /var/spool/xrootd    # admin socket directory
xrootd_log_path:    /var/log/xrootd      # log files
xrootd_auth_dir:    /opt/xrd/etc         # Authfile and related config

# --- Network ----------------------------------------------------------------
xrootd_port:         1094   # XRootD protocol + HTTP port
xrootd_bind_address: ""     # empty = bind all interfaces

# --- TLS --------------------------------------------------------------------
# Populated by the certificates role. Override only if managing certs manually.
xrootd_tls_enabled: true
xrootd_cert_file:   /etc/xrootd/tls/server.crt
xrootd_key_file:    /etc/xrootd/tls/server.key
# CA bundle PEM file — used by xrd.tlsca certfile (file and system modes).
# For self-signed mode: the certificates role writes the server cert here.
# For system mode: symlinked to the OS CA bundle by the certificates role.
xrootd_ca_file:     /etc/xrootd/tls/ca.crt

# CA verification mode for xrd.tlsca — must match certificates role value:
#   file   — certfile {{ xrootd_ca_file }} (default)
#   system — certfile {{ xrootd_ca_file }} (symlinked to OS bundle by certs role)
#   grid   — certdir {{ xrootd_ca_dir }} (managed by fetch-crl via certs role)
xrootd_ca_mode: file
xrootd_ca_dir:  /etc/grid-security/certificates
# Grid CA bundle provider — set in certificates role; listed here for reference:
#   egi (default) — EGI IGTF trust anchors (Rocky + Ubuntu)
#   osg           — OSG/CILogon trust anchors (Rocky only)

# --- Features (all opt-in — explicitly enable what you need) ----------------
xrootd_http_enabled:       false   # HTTP/WebDAV protocol (requires xrootd-server with HTTP plugin)
xrootd_http_tpc_enabled:   false   # Third Party Copy (requires HTTP enabled)
xrootd_auth_enabled:       false   # Authfile-based access control
xrootd_scitokens_enabled:  false   # SciTokens / WLCG JWT token auth
xrootd_macaroons_enabled:  false   # Macaroon bearer token auth
xrootd_monitoring_enabled: false   # UDP monitoring export

# --- Macaroon secret --------------------------------------------------------
# If vault_macaroon_secret is set: that value is written to the file (required
# for multi-node deployments where tokens must validate across nodes).
# If unset and the file does not exist: a random secret is auto-generated
# (standalone only — not safe for clusters).
xrootd_macaroon_secret_file: /etc/xrootd/macaroon-secret

# --- SciTokens --------------------------------------------------------------
xrootd_scitokens_audience: "https://wlcg.cern.ch/jwt/v1/any"
xrootd_scitokens_issuers: []
# Example issuer entry:
# - name:         my-iam
#   url:          https://iam.example.org/
#   base_path:    /
#   default_user: xrootd

# --- Authfile entries -------------------------------------------------------
xrootd_auth_entries: []
# Example entry:
# - type: g            # u=unix user, g=group, h=hostname
#   name: /ska
#   path: /data/xrootd
#   permissions: rl    # r=read, l=list, w=write, d=delete, a=all

# --- Monitoring (xrd.monitor) -----------------------------------------------
# Sends detailed per-operation event records to a UDP collector.
xrootd_monitoring_host: ""
xrootd_monitoring_port: 9931

# --- Reporting (xrd.report) -------------------------------------------------
# Sends periodic summary statistics to a UDP sink (e.g. xrootd_exporter).
# Distinct from xrd.monitor — lighter weight, suitable for Prometheus scraping.
xrootd_reporting_enabled:  false
xrootd_reporting_host:     ""       # required when xrootd_reporting_enabled: true
xrootd_reporting_port:     9931
xrootd_reporting_interval: "1m"

# --- Trace / logging --------------------------------------------------------
# Empty string omits the directive (uses xrootd built-in defaults).
# Set to a space-separated list of trace flags to enable.
# Examples:
#   xrootd_trace_xrd:      "conn mem net"
#   xrootd_trace_xrootd:   "auth emsg login"
#   xrootd_trace_http:     "request response"   # only emitted when http_enabled
#   xrootd_macaroon_trace: "debug"               # only emitted when macaroons_enabled
xrootd_trace_xrd:      ""
xrootd_trace_xrootd:   ""
xrootd_trace_http:     ""
xrootd_macaroon_trace: ""

# --- Clustered / server mode ------------------------------------------------
xrootd_redirector_host: ""
xrootd_redirector_port: 1094

# --- Log rotation -----------------------------------------------------------
xrootd_log_rotate_frequency: weekly   # daily | weekly | monthly
xrootd_log_rotate_count:     4        # number of rotated files to keep

# --- Site identity ----------------------------------------------------------
xrootd_site_name: "{{ inventory_hostname }}"

# --- User / group -----------------------------------------------------------
xrootd_user:      xrootd   # service account name
xrootd_group:     xrootd   # primary group name
# Leave unset to let the OS pick a free system-range ID (recommended).
# Set to a fixed value for consistent IDs across a multi-node cluster.
# xrootd_user_uid: 988
# xrootd_group_gid: 988

# --- Package version --------------------------------------------------------
# Pin to a specific XRootD release. Empty string installs the latest version
# available from the configured repository (EPEL or CERN repo).
# Examples: "5.6.9"  "5.7.1"
xrootd_version: ""

# --- Package lists ----------------------------------------------------------
# Optional feature packages are appended in install.yml based on enabled flags.
_xrootd_base_packages_rocky:
  - xrootd
  - xrootd-server
  - xrootd-client
  - xrootd-libs
  - python3-xrootd

_xrootd_base_packages_ubuntu:
  - xrootd-server
  - xrootd-client
  - python3-xrootd
