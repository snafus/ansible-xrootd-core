---
# Build the package list from the base set plus any enabled feature packages,
# then install and verify the xrootd binary.

- name: Build package list (Rocky)
  ansible.builtin.set_fact:
    _xrootd_packages: >-
      {{ _xrootd_base_packages_rocky +
         (['xrootd-scitokens'] if xrootd_scitokens_enabled | bool else []) }}
  when: ansible_facts['os_family'] == 'RedHat'

- name: Build package list (Ubuntu)
  ansible.builtin.set_fact:
    _xrootd_packages: >-
      {{ _xrootd_base_packages_ubuntu +
         (['xrootd-scitokens-plugins'] if xrootd_scitokens_enabled | bool else []) }}
  when: ansible_facts['os_family'] == 'Debian'

- name: Install XRootD packages
  ansible.builtin.package:
    name: "{{ _xrootd_packages }}"
    state: present
    update_cache: true

# xrootd --version writes to stderr; capture both streams.
- name: Get installed XRootD version
  ansible.builtin.command: xrootd --version
  register: _xrootd_version
  changed_when: false
  failed_when: false

- name: Show installed XRootD version
  ansible.builtin.debug:
    msg: "XRootD: {{ (_xrootd_version.stderr | default('') + _xrootd_version.stdout | default('')) | trim }}"
