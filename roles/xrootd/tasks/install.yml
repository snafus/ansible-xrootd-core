---
# Build the package list from the base set plus any enabled feature packages,
# then install and verify the xrootd binary.

- name: Build package list (Rocky)
  ansible.builtin.set_fact:
    _xrootd_packages: >-
      {{ _xrootd_base_packages_rocky +
         (['xrootd-scitokens'] if xrootd_scitokens_enabled | bool else []) +
         (['jemalloc'] if xrootd_jemalloc_enabled | bool else []) }}
  when: ansible_facts['os_family'] == 'RedHat'

- name: Build package list (Ubuntu)
  ansible.builtin.set_fact:
    _xrootd_packages: >-
      {{ _xrootd_base_packages_ubuntu +
         (['xrootd-scitokens-plugins'] if xrootd_scitokens_enabled | bool else []) +
         (['libjemalloc2'] if xrootd_jemalloc_enabled | bool else []) }}
  when: ansible_facts['os_family'] == 'Debian'

# RPM version spec: xrootd-5.6.9  (dash-separated)
- name: Apply version pin to package list (Rocky)
  ansible.builtin.set_fact:
    _xrootd_packages: "{{ _xrootd_packages | product([xrootd_version]) | map('join', '-') | list }}"
  when:
    - ansible_facts['os_family'] == 'RedHat'
    - xrootd_version | length > 0

# apt version spec: xrootd-server=5.6.9  (equals-separated)
- name: Apply version pin to package list (Ubuntu)
  ansible.builtin.set_fact:
    _xrootd_packages: "{{ _xrootd_packages | product([xrootd_version]) | map('join', '=') | list }}"
  when:
    - ansible_facts['os_family'] == 'Debian'
    - xrootd_version | length > 0

- name: Install XRootD packages
  ansible.builtin.package:
    name: "{{ _xrootd_packages }}"
    state: present
    update_cache: true

# xrootd does not support --version; query the package manager instead.
- name: Get installed XRootD version (Rocky)
  ansible.builtin.command:
    cmd: rpm -q xrootd --queryformat '%{NAME}-%{VERSION}-%{RELEASE}\n'
  register: _xrootd_version_result
  changed_when: false
  failed_when: false
  when: ansible_facts['os_family'] == 'RedHat'

- name: Get installed XRootD version (Ubuntu)
  ansible.builtin.command:
    cmd: dpkg-query -W -f='${Package} ${Version}\n' xrootd-server
  register: _xrootd_version_result
  changed_when: false
  failed_when: false
  when: ansible_facts['os_family'] == 'Debian'

- name: Show installed XRootD version
  ansible.builtin.debug:
    msg: "XRootD: {{ _xrootd_version_result.stdout | default('unknown') | trim }}"
