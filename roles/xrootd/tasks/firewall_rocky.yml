---
# Open XRootD ports in firewalld.

- name: Allow XRootD/HTTP port (TCP)
  ansible.posix.firewalld:
    port: "{{ xrootd_port }}/tcp"
    permanent: true
    state: enabled
    immediate: true

# UDP on the same port is used by the xrd.monitor UDP stats export.
- name: Allow XRootD monitoring port (UDP)
  ansible.posix.firewalld:
    port: "{{ xrootd_port }}/udp"
    permanent: true
    state: enabled
    immediate: true
  when: xrootd_monitoring_enabled | bool

# certbot standalone mode needs port 80 open for the ACME HTTP-01 challenge.
- name: Allow HTTP (port 80) for certbot ACME challenge
  ansible.posix.firewalld:
    service: http
    permanent: true
    state: enabled
    immediate: true
  when: xrootd_cert_mode in ['certbot_staging', 'certbot_production']
