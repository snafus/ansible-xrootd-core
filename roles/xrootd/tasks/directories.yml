---
# Create all directories required by XRootD.

- name: Create data export directory
  ansible.builtin.file:
    path: "{{ xrootd_data_path }}"
    state: directory
    owner: "{{ xrootd_user }}"
    group: "{{ xrootd_group }}"
    mode: "0755"

- name: Create admin socket directory
  ansible.builtin.file:
    path: "{{ xrootd_admin_path }}"
    state: directory
    owner: "{{ xrootd_user }}"
    group: "{{ xrootd_group }}"
    mode: "0755"

- name: Create log directory
  ansible.builtin.file:
    path: "{{ xrootd_log_path }}"
    state: directory
    owner: "{{ xrootd_user }}"
    group: "{{ xrootd_group }}"
    mode: "0750"

- name: Create auth config directory
  ansible.builtin.file:
    path: "{{ xrootd_auth_dir }}"
    state: directory
    owner: "{{ xrootd_user }}"
    group: "{{ xrootd_group }}"
    mode: "0750"
