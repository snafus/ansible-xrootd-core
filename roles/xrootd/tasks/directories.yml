---
# Create all directories required by XRootD.

- name: Create export directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ xrootd_user }}"
    group: "{{ xrootd_group }}"
    mode: "{{ item.mode | default('0755') }}"
  loop: "{{ xrootd_exports }}"
  when: item.create | default(true) | bool

- name: Create admin socket directory
  ansible.builtin.file:
    path: "{{ xrootd_admin_path }}"
    state: directory
    owner: "{{ xrootd_user }}"
    group: "{{ xrootd_group }}"
    mode: "0755"

- name: Create log directory
  ansible.builtin.file:
    path: "{{ xrootd_log_path }}"
    state: directory
    owner: "{{ xrootd_user }}"
    group: "{{ xrootd_group }}"
    mode: "0750"

- name: Create auth config directory
  ansible.builtin.file:
    path: "{{ xrootd_auth_dir }}"
    state: directory
    owner: "{{ xrootd_user }}"
    group: "{{ xrootd_group }}"
    mode: "0750"
