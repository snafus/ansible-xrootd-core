---
# Create all directories required by XRootD.

- name: Create export directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ xrootd_user }}"
    group: "{{ xrootd_group }}"
    mode: "{{ item.mode | default('0755') }}"
  loop: "{{ xrootd_exports }}"
  when: item.create | default(true) | bool

# For mount: true entries, verify the path is a real mount point — not just a
# plain directory. This prevents xrootd from silently exporting from an empty
# underlying directory when a filesystem (CephFS, NFS, Lustre) is not mounted.
- name: Check mount point status for export paths
  ansible.builtin.command:
    cmd: "mountpoint -q {{ item.path }}"
  loop: "{{ xrootd_exports }}"
  when: item.mount | default(false) | bool
  changed_when: false
  failed_when: false
  register: _mount_check

- name: Assert mount-flagged export paths are mounted
  ansible.builtin.assert:
    that: item.rc == 0
    fail_msg: >
      Export path {{ item.item.path }} has mount: true but is not a mount point.
      Ensure the filesystem is mounted before running this role.
  loop: "{{ _mount_check.results }}"
  when: item is not skipped

- name: Create admin socket directory
  ansible.builtin.file:
    path: "{{ xrootd_admin_path }}"
    state: directory
    owner: "{{ xrootd_user }}"
    group: "{{ xrootd_group }}"
    mode: "0755"

- name: Create log directory
  ansible.builtin.file:
    path: "{{ xrootd_log_path }}"
    state: directory
    owner: "{{ xrootd_user }}"
    group: "{{ xrootd_group }}"
    mode: "0750"

- name: Create auth config directory
  ansible.builtin.file:
    path: "{{ xrootd_auth_dir }}"
    state: directory
    owner: "{{ xrootd_user }}"
    group: "{{ xrootd_group }}"
    mode: "0750"
