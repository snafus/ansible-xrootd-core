---
- name: Verify
  hosts: all
  become: false
  tasks:
    - name: Common xrootd checks
      ansible.builtin.include_tasks: ../resources/verify_common.yml

    # --- TLS files -----------------------------------------------------------
    - name: Stat CA bundle file
      ansible.builtin.stat:
        path: /etc/xrootd/tls/ca.crt
      register: _ca_stat

    - name: Assert CA bundle exists
      ansible.builtin.assert:
        that:
          - _ca_stat.stat.exists
        fail_msg: "CA bundle not found at /etc/xrootd/tls/ca.crt"

    # --- Logrotate -----------------------------------------------------------
    - name: Stat logrotate config
      ansible.builtin.stat:
        path: /etc/logrotate.d/xrootd
      register: _logrotate_stat

    - name: Assert logrotate config is deployed
      ansible.builtin.assert:
        that:
          - _logrotate_stat.stat.exists
        fail_msg: "Logrotate config not found at /etc/logrotate.d/xrootd"

    # --- User / group --------------------------------------------------------
    - name: Get xrootd user entry
      ansible.builtin.command:
        cmd: getent passwd xrootd
      register: _passwd_xrootd
      changed_when: false

    - name: Assert xrootd user has a nologin shell
      ansible.builtin.assert:
        that:
          - "'/nologin' in _passwd_xrootd.stdout or '/false' in _passwd_xrootd.stdout"
        fail_msg: >
          xrootd user does not use a nologin shell: {{ _passwd_xrootd.stdout }}
