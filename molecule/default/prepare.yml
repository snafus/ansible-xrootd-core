---
# Molecule prepare — install packages before the converge playbook runs.
# In CI the CERN XRootD repo may be unreachable; install xrootd from EPEL
# so the xrootd role can configure and start the service.

- name: Prepare
  hosts: all
  gather_facts: true
  become: false  # container runs as root already
  tasks:
    - name: Install EPEL repository (Rocky/RHEL family)
      ansible.builtin.dnf:
        name: epel-release
        state: present
      when: ansible_facts['os_family'] == 'RedHat'

    - name: Install xrootd from EPEL (Molecule — CERN repo may be unreachable)
      ansible.builtin.dnf:
        name:
          - xrootd
          - xrootd-server
          - xrootd-client
        state: present
        enablerepo: epel
      when: ansible_facts['os_family'] == 'RedHat'

    - name: Install xrootd from Ubuntu universe (Molecule — pre-install before CERN repo is configured)
      ansible.builtin.apt:
        name:
          - xrootd-server
          - xrootd-client
        state: present
        update_cache: true
      when: ansible_facts['os_family'] == 'Debian'
