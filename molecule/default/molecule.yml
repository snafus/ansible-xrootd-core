---
# Molecule default scenario — full converge + verify
# Uses geerlingguy's systemd-enabled Docker images.
# The MOLECULE_DISTRO environment variable selects the target OS;
# defaults to rockylinux9 for local runs.

dependency:
  name: galaxy
  options:
    requirements-file: requirements.yml

driver:
  name: docker

platforms:
  - name: "xrootd-${MOLECULE_DISTRO:-rockylinux9}"
    image: "geerlingguy/docker-${MOLECULE_DISTRO:-rockylinux9}-ansible:latest"
    command: /usr/lib/systemd/systemd
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true       # required for systemd in Docker
    pre_build_image: true

provisioner:
  name: ansible
  env:
    ANSIBLE_ROLES_PATH: "${MOLECULE_PROJECT_DIRECTORY}/roles"
    ANSIBLE_INJECT_FACTS_AS_VARS: "False"
  inventory:
    group_vars:
      all:
        ansible_user: root
    host_vars:
      xrootd-rockylinux9:
        xrootd_data_path: /data/xrootd
        # Minimal config for Molecule: plain XRootD protocol only.
        # TLS, HTTP, and TPC require CERN repo packages; tested in integration.
        xrootd_cert_mode: self_signed
        xrootd_tls_enabled: false
        xrootd_http_enabled: false
        xrootd_http_tpc_enabled: false
      xrootd-rockylinux8:
        xrootd_data_path: /data/xrootd
        xrootd_cert_mode: self_signed
        xrootd_tls_enabled: false
        xrootd_http_enabled: false
        xrootd_http_tpc_enabled: false
      xrootd-ubuntu2204:
        xrootd_data_path: /data/xrootd
        xrootd_cert_mode: self_signed
        xrootd_tls_enabled: false
        xrootd_http_enabled: false
        xrootd_http_tpc_enabled: false
      xrootd-ubuntu2404:
        xrootd_data_path: /data/xrootd
        xrootd_cert_mode: self_signed
        xrootd_tls_enabled: false
        xrootd_http_enabled: false
        xrootd_http_tpc_enabled: false
  options:
    diff: true

verifier:
  name: ansible
