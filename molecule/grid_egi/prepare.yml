---
# Molecule prepare — install xrootd packages before converge.
# Mirrors molecule/default/prepare.yml — kept in sync.
- name: Prepare
  hosts: all
  gather_facts: true
  become: false
  tasks:
    - name: Install EPEL repository (Rocky/RHEL family)
      ansible.builtin.dnf:
        name: epel-release
        state: present
      when: ansible_facts['os_family'] == 'RedHat'

    - name: Install xrootd from EPEL (Rocky)
      ansible.builtin.dnf:
        name:
          - xrootd
          - xrootd-server
          - xrootd-client
        state: present
        enablerepo: epel
      when: ansible_facts['os_family'] == 'RedHat'

    - name: Install xrootd from Ubuntu universe
      ansible.builtin.apt:
        name:
          - xrootd-server
          - xrootd-client
        state: present
        update_cache: true
      when: ansible_facts['os_family'] == 'Debian'
