---
# Step 1: generate a throwaway cert on the Ansible controller.
# Step 2: install xrootd packages and place cert files on the target host.
#
# The cert is self-signed and used as both the server cert and CA bundle.
# Files are placed at /tmp/molecule-host-*.{crt,key} on the target so that
# the host-path sub-mode (xrootd_ext_cert_host_src) can be exercised in CI.

- name: Generate throwaway test certificate (Ansible controller)
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Generate self-signed test key and certificate
      ansible.builtin.command:
        cmd: >
          openssl req -x509 -newkey rsa:2048 -days 1 -nodes
          -keyout /tmp/molecule-test.key
          -out /tmp/molecule-test.crt
          -subj "/CN=molecule-cert-external-test"
        creates: /tmp/molecule-test.crt

- name: Prepare XRootD host
  hosts: all
  gather_facts: true
  become: false
  tasks:
    - name: Install EPEL repository (Rocky/RHEL family)
      ansible.builtin.dnf:
        name: epel-release
        state: present
      when: ansible_facts['os_family'] == 'RedHat'

    - name: Install xrootd from EPEL (Rocky)
      ansible.builtin.dnf:
        name:
          - xrootd
          - xrootd-server
          - xrootd-client
        state: present
        enablerepo: epel
      when: ansible_facts['os_family'] == 'RedHat'

    - name: Install xrootd from Ubuntu universe
      ansible.builtin.apt:
        name:
          - xrootd-server
          - xrootd-client
        state: present
        update_cache: true
      when: ansible_facts['os_family'] == 'Debian'

    - name: Place test certificate on host (Sub-mode C staging path)
      ansible.builtin.copy:
        src: /tmp/molecule-test.crt
        dest: /tmp/molecule-host-cert.crt
        mode: "0644"

    - name: Place test private key on host (Sub-mode C staging path)
      ansible.builtin.copy:
        src: /tmp/molecule-test.key
        dest: /tmp/molecule-host-cert.key
        mode: "0600"
