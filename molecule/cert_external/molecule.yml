---
# Molecule cert_external scenario — operator-supplied certificate (host path mode)
# cert_mode: external, ca_mode: file
# prepare.yml generates a throwaway cert on the controller and copies it to the
# host; converge uses xrootd_ext_cert_host_src to exercise Sub-mode C.

dependency:
  name: galaxy
  options:
    requirements-file: requirements.yml

driver:
  name: docker

platforms:
  - name: "xrootd-${MOLECULE_DISTRO:-rockylinux9}"
    image: "geerlingguy/docker-${MOLECULE_DISTRO:-rockylinux9}-ansible:latest"
    command: /usr/lib/systemd/systemd
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
    pre_build_image: true

provisioner:
  name: ansible
  env:
    ANSIBLE_ROLES_PATH: "${MOLECULE_PROJECT_DIRECTORY}/roles"
    ANSIBLE_INJECT_FACTS_AS_VARS: "False"
  inventory:
    group_vars:
      all:
        ansible_user: root
        xrootd_exports:
          - path: /data/xrootd
        xrootd_tls_enabled: false
        xrootd_http_enabled: false
        xrootd_http_tpc_enabled: false
  options:
    diff: true

verifier:
  name: ansible
