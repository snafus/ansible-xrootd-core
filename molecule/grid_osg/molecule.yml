---
# Molecule grid_osg scenario — OSG/CILogon trust anchors + fetch-crl
# cert_mode: self_signed, ca_mode: grid, ca_bundle_provider: osg
# Rocky 9 only (OSG does not publish Ubuntu packages).

dependency:
  name: galaxy
  options:
    requirements-file: requirements.yml

driver:
  name: docker

platforms:
  - name: xrootd-rockylinux9
    image: "geerlingguy/docker-rockylinux9-ansible:latest"
    command: /usr/lib/systemd/systemd
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
    pre_build_image: true

provisioner:
  name: ansible
  env:
    ANSIBLE_ROLES_PATH: "${MOLECULE_PROJECT_DIRECTORY}/roles"
    ANSIBLE_INJECT_FACTS_AS_VARS: "False"
  inventory:
    group_vars:
      all:
        ansible_user: root
        xrootd_exports:
          - path: /data/xrootd
        xrootd_cert_mode: self_signed
        xrootd_ca_mode: grid
        xrootd_ca_bundle_provider: osg
        xrootd_tls_enabled: false
        xrootd_http_enabled: false
        xrootd_http_tpc_enabled: false
  options:
    diff: true

verifier:
  name: ansible
