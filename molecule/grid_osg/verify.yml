---
# grid ca_mode: xrootd_ca_file (/etc/xrootd/tls/ca.crt) is intentionally absent;
# xrd.tlsca uses certdir instead.
- name: Verify
  hosts: all
  become: false
  tasks:
    - name: Common xrootd checks
      ansible.builtin.include_tasks: ../resources/verify_common.yml

    # --- OSG trust anchors ---------------------------------------------------
    - name: Check osg-ca-certs package is installed
      ansible.builtin.command:
        cmd: rpm -q osg-ca-certs
      register: _osg_pkg
      changed_when: false

    - name: Assert osg-ca-certs is installed
      ansible.builtin.assert:
        that:
          - _osg_pkg.rc == 0
        fail_msg: "osg-ca-certs package is not installed: {{ _osg_pkg.stdout }}"

    - name: Stat grid certificate directory
      ansible.builtin.stat:
        path: /etc/grid-security/certificates
      register: _certdir_stat

    - name: Assert grid certificate directory exists
      ansible.builtin.assert:
        that:
          - _certdir_stat.stat.exists
          - _certdir_stat.stat.isdir
        fail_msg: "/etc/grid-security/certificates is missing"

    - name: Find CA certificate files in grid certdir
      ansible.builtin.find:
        paths: /etc/grid-security/certificates
        patterns: "*.pem"
      register: _ca_files

    - name: Assert grid certdir contains CA certificates
      ansible.builtin.assert:
        that:
          - _ca_files.matched > 0
        fail_msg: >
          No CA certificate files (*.pem) in /etc/grid-security/certificates —
          osg-ca-certs may not have installed correctly.

    - name: Find CRL files in grid certdir
      ansible.builtin.find:
        paths: /etc/grid-security/certificates
        patterns: "*.r0"
      register: _crl_files

    - name: Assert CRL files are present (fetch-crl ran successfully)
      ansible.builtin.assert:
        that:
          - _crl_files.matched > 0
        fail_msg: >
          No CRL files (*.r0) in /etc/grid-security/certificates —
          fetch-crl may not have run or all endpoints were unreachable.

    - name: Check fetch-crl.timer is enabled
      ansible.builtin.systemd:
        name: fetch-crl.timer
      register: _crl_timer

    - name: Assert fetch-crl.timer is enabled
      ansible.builtin.assert:
        that:
          - _crl_timer.status.UnitFileState in ['enabled', 'enabled-runtime']
        fail_msg: "fetch-crl.timer is not enabled: {{ _crl_timer.status.UnitFileState }}"
