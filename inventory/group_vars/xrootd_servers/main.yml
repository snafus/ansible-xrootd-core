---
# Group variables for xrootd_servers — comprehensive reference
#
# All settings are optional unless marked REQUIRED.
# Uncomment and adjust the sections relevant to your deployment.
# For secrets (keys, tokens, passwords) use vault.yml instead of this file.
#
# Full variable reference: roles/xrootd/defaults/main.yml
#                          roles/certificates/defaults/main.yml

# ---------------------------------------------------------------------------
# REQUIRED
# ---------------------------------------------------------------------------

xrootd_data_path: /data/xrootd      # filesystem path exported into the namespace

# ---------------------------------------------------------------------------
# Network
# ---------------------------------------------------------------------------

# xrootd_port: 1094                 # XRootD + HTTP port (default: 1094)
# xrootd_bind_address: ""           # bind to a specific IP; empty = all interfaces
# xrootd_site_name: "{{ inventory_hostname }}"   # reported in xrd.report / monitoring

# ---------------------------------------------------------------------------
# Certificate mode
# ---------------------------------------------------------------------------
# Options: self_signed (default) | certbot_staging | certbot_production | external

# xrootd_cert_mode: self_signed

# Let's Encrypt (certbot_staging or certbot_production):
#   Requires public DNS, port 80 open, and vault_certbot_email in vault.yml.
# xrootd_cert_mode: certbot_production

# External certificate (PEM content from vault — preferred; key never on disk):
#   Set vault_xrootd_ext_cert, vault_xrootd_ext_key (and optionally
#   vault_xrootd_ext_ca) in vault.yml.
# xrootd_cert_mode: external

# ---------------------------------------------------------------------------
# CA trust mode
# ---------------------------------------------------------------------------
# Controls xrd.tlsca — how XRootD verifies client/peer certificates.
# Options: file (default) | system | grid
#
#   file   — use xrootd_ca_file; correct for self_signed and external modes
#   system — symlink OS CA bundle to xrootd_ca_file; use with certbot/public CAs
#   grid   — install IGTF/OSG trust anchors + fetch-crl; use xrd.tlsca certdir

# xrootd_ca_mode: file

# Grid mode: select the trust anchor bundle provider.
# Options: egi (default, Rocky + Ubuntu) | osg (Rocky only)
# On Rocky, SHA-1 crypto policy relaxation is applied automatically.
# xrootd_ca_bundle_provider: egi

# ---------------------------------------------------------------------------
# TLS
# ---------------------------------------------------------------------------

# xrootd_tls_enabled: true          # disable only for isolated test environments

# ---------------------------------------------------------------------------
# HTTP / WebDAV
# ---------------------------------------------------------------------------

# xrootd_http_enabled: true         # HTTP/WebDAV protocol plugin
# xrootd_http_tpc_enabled: true     # Third Party Copy (requires http_enabled)

# ---------------------------------------------------------------------------
# Authorisation
# ---------------------------------------------------------------------------

# xrootd_auth_enabled: true         # Authfile-based access control
# xrootd_auth_entries:
#   - type: g                        # u=unix user, g=group, h=hostname
#     name: /ska
#     path: /data/xrootd
#     permissions: rl                # r=read, l=list, w=write, d=delete, a=all

# xrootd_macaroons_enabled: true    # Macaroon bearer token auth
#   vault_macaroon_secret in vault.yml — required for multi-node clusters

# xrootd_scitokens_enabled: true    # SciTokens / WLCG JWT token auth
# xrootd_scitokens_audience: "https://wlcg.cern.ch/jwt/v1/any"
# xrootd_scitokens_issuers:
#   - name: my-iam
#     url: https://iam.example.org/
#     base_path: /
#     default_user: xrootd

# ---------------------------------------------------------------------------
# Monitoring and reporting
# ---------------------------------------------------------------------------

# xrd.monitor: detailed per-operation event stream (AAI / traffic analysis)
# xrootd_monitoring_enabled: true
# xrootd_monitoring_host: "collector.example.org"   # required when enabled
# xrootd_monitoring_port: 9931

# xrd.report: periodic summary statistics (xrootd_exporter / Prometheus)
# xrootd_reporting_enabled: true
# xrootd_reporting_host: "collector.example.org"    # required when enabled
# xrootd_reporting_port: 9931
# xrootd_reporting_interval: "1m"

# ---------------------------------------------------------------------------
# System resource limits  (systemd drop-in: xrootd@.service.d/limits.conf)
# ---------------------------------------------------------------------------
# Defaults are sized for Tier-1 / SRCNet production nodes.
# XRootD opens one file descriptor per active connection and per open file.

# xrootd_limit_nofile: 1048576      # LimitNOFILE — open file descriptors (1 M)
# xrootd_limit_nproc:  65536        # LimitNPROC  — threads / sub-processes

# jemalloc: reduces allocator lock contention under high concurrency.
# Installs the OS package and sets LD_PRELOAD in the systemd drop-in.
# Recommended for high-throughput nodes; disabled by default.
# xrootd_jemalloc_enabled: false

# ---------------------------------------------------------------------------
# User / group
# ---------------------------------------------------------------------------
# Leave unset to let the OS assign free system-range IDs (recommended for
# single-node deployments).  Pin for consistent IDs across a cluster.

# xrootd_user_uid: 988
# xrootd_group_gid: 988

# ---------------------------------------------------------------------------
# Package version
# ---------------------------------------------------------------------------
# Empty string installs the latest version from the configured repository.

# xrootd_version: "5.6.9"

# ---------------------------------------------------------------------------
# Log rotation
# ---------------------------------------------------------------------------

# xrootd_log_rotate_frequency: weekly   # daily | weekly | monthly
# xrootd_log_rotate_count: 4

# ---------------------------------------------------------------------------
# Trace / debug logging  (empty = use XRootD built-in defaults)
# ---------------------------------------------------------------------------

# xrootd_trace_xrd:      "conn net"         # xrd.trace flags
# xrootd_trace_xrootd:   "auth login"       # xrootd.trace flags
# xrootd_trace_http:     "request response" # http.trace (http_enabled only)
# xrootd_macaroon_trace: "debug"            # macaroons.trace (macaroons_enabled only)
