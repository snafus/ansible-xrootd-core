---
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # --------------------------------------------------------------------------
  # Job 1: Lint — yamllint + ansible-lint
  # --------------------------------------------------------------------------
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install lint dependencies
        run: pip install -r dev-requirements.txt

      - name: Install Ansible collections
        run: ansible-galaxy collection install -r requirements.yml

      - name: Run yamllint
        run: yamllint .

      - name: Run ansible-lint
        run: ansible-lint

  # --------------------------------------------------------------------------
  # Job 2: Syntax check — fast validation without running against real hosts
  # --------------------------------------------------------------------------
  syntax-check:
    name: Syntax Check
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ansible
        run: pip install -r dev-requirements.txt

      - name: Install Ansible collections
        run: ansible-galaxy collection install -r requirements.yml

      - name: Syntax check — site.yml
        run: >
          ansible-playbook site.yml
          --syntax-check
          -i tests/inventory/hosts.yml

      - name: Syntax check — playbooks/certificates.yml
        run: >
          ansible-playbook playbooks/certificates.yml
          --syntax-check
          -i tests/inventory/hosts.yml

      - name: Syntax check — playbooks/tune.yml
        run: >
          ansible-playbook playbooks/tune.yml
          --syntax-check
          -i tests/inventory/hosts.yml

  # --------------------------------------------------------------------------
  # Job 3: Molecule — full converge + verify inside a Docker container
  #
  # Matrix is pre-configured for all target platforms; only Rocky 9 is active.
  # To expand coverage, uncomment additional entries under matrix.distro.
  # --------------------------------------------------------------------------
  molecule:
    name: "Molecule (${{ matrix.scenario }} / ${{ matrix.distro }})"
    runs-on: ubuntu-latest
    needs: syntax-check

    strategy:
      fail-fast: false
      matrix:
        include:
          # default: self_signed cert, ca_mode=file
          - scenario: default
            distro: rockylinux9
          - scenario: default
            distro: ubuntu2204
          # grid_egi: EGI IGTF trust anchors + fetch-crl
          - scenario: grid_egi
            distro: rockylinux9
          - scenario: grid_egi
            distro: ubuntu2204
          # grid_osg: OSG/CILogon trust anchors (Rocky only)
          - scenario: grid_osg
            distro: rockylinux9
          # cert_external: operator-supplied certificate (controller path mode)
          - scenario: cert_external
            distro: rockylinux9
          - scenario: cert_external
            distro: ubuntu2204

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Molecule and dependencies
        run: pip install -r dev-requirements.txt

      - name: Install Ansible collections
        run: ansible-galaxy collection install -r requirements.yml

      - name: Run Molecule
        run: molecule test -s ${{ matrix.scenario }}
        env:
          MOLECULE_DISTRO: ${{ matrix.distro }}
        working-directory: ${{ github.workspace }}
